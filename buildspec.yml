version: 0.2

phases:
  install:
    commands:
      - echo Installing Docker...
  
  pre_build:
    commands:
      - echo USER: $DOCKER_USERNAME
      - echo PASS: $DOCKER_PASSWORD
      - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD

  build:
    commands:
      - echo Building backend image
      - cd backend
      - docker build -t $DOCKER_USERNAME/nexus-backend:latest .

  post_build:
    commands:
      - echo Pushing image to Docker Hub
      - docker push $DOCKER_USERNAME/nexus-backend:latest
