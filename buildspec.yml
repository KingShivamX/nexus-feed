version: 0.2

phases:
  install:
    commands:
      - echo Installing Docker...
  pre_build:
    commands:
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin
  build:
    commands:
      - cd backend
      - docker build -t $DOCKER_USERNAME/nexus-backend:latest .
  post_build:
    commands:
      - docker push $DOCKER_USERNAME/nexus-backend:latest
